<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Rescue &mdash; مدربك الدراسي الذكي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23C13A0D'/%3E%3Ccircle cx='50' cy='50' r='17' fill='none' stroke='%23F5F0E6' stroke-width='9'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#F5F0E6;--card:#FFFDF8;--ink:#241E14;--muted:#6B6254;--ink-15:rgba(36,30,20,.14);--ink-30:rgba(36,30,20,.3);--accent:#C13A0D;--hl:#FFD43B;--green:#1E7A4D;--green-soft:#E5F2E9;--red:#B3372B;--red-soft:#F8E7E3;--amber:#8A6D1A;--amber-soft:#FAEEDA;--r:14px;--shadow:4px 4px 0 var(--ink)}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.9;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.en{font-family:'Segoe UI',Arial,sans-serif;direction:ltr}body.en .brand-txt,body.en h1,body.en h2,body.en h3,body.en .jnum,body.en .lvl-big,body.en .step-n,body.en .sn-dot{font-family:'Segoe UI',Arial,sans-serif}body.en .hero::after{inset-inline-start:11px;inset-inline-end:auto}
h1,h2,h3,.brand-txt,.jnum,.lvl-big,.step-n,.sn-dot{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.ic{width:1.05em;height:1.05em;vertical-align:-.18em;flex:none}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:20px}
.n7{max-width:780px}.n9{max-width:960px}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes stampIn{from{transform:rotate(-16deg) scale(1.9);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.92}}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:1rem;padding:12px 22px;border-radius:12px;border:1.5px solid var(--ink);cursor:pointer;text-decoration:none;line-height:1.5;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--accent);color:#fff}
.btn-sm{padding:8px 14px;font-size:.88rem;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.btn-lg{padding:14px 28px;font-size:1.05rem}
.btn-block{width:100%}
.topbar{position:sticky;top:0;z-index:50;height:62px;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.bar-in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand-txt{font-weight:700;font-size:1.12rem}.brand-txt b{color:var(--accent)}
.nav-actions{display:flex;align-items:center;gap:10px}
.lvl-mini{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--hl);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.82rem;box-shadow:2px 2px 0 var(--ink)}
.view{display:none}.view.on{display:block;animation:fadeUp .4s ease both}
.hero{position:relative;padding:58px 0 66px;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(to bottom,transparent 0 34px,rgba(36,30,20,.07) 34px 35.5px)}
.hero::after{content:'';position:absolute;top:0;bottom:0;inset-inline-end:11px;width:1.5px;background:rgba(193,58,13,.3);pointer-events:none}
.hero-grid{position:relative;display:grid;gap:38px;align-items:center}
@media(min-width:920px){.hero-grid{grid-template-columns:1.05fr .95fr}}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--accent)}
.kicker::before{content:'';width:26px;height:2.5px;background:var(--accent);border-radius:2px}
.hero h1{font-size:clamp(1.9rem,7.4vw,3.4rem);line-height:1.45;margin:14px 0 18px;font-weight:700}
.hl{position:relative;z-index:0;white-space:nowrap}
.hl::before{content:'';position:absolute;inset:52% -5% 6%;background:var(--hl);transform:rotate(-1.2deg);border-radius:3px;z-index:-1}
.lede{font-size:clamp(1rem,3.6vw,1.14rem);color:#4A4235;max-width:56ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin:26px 0 18px}
.hero-note{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:500}
.fchips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--ink);border-radius:99px;padding:6px 13px;font-size:.8rem;font-weight:700;box-shadow:2px 2px 0 var(--ink)}
.fchip svg{color:var(--accent)}
.fchips>:nth-child(1){transform:rotate(-2deg)}.fchips>:nth-child(2){transform:rotate(1.4deg)}.fchips>:nth-child(3){transform:rotate(-1deg)}
.jcard{padding:22px 22px 18px;position:relative}
.jcard h3{font-size:1.15rem;margin-top:4px}
.jrow{display:flex;align-items:center;gap:14px;margin:14px 0 10px}
.jnum{font-size:3.1rem;font-weight:700;line-height:1;min-width:105px}
.jchip{border:1.5px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:700;font-size:.92rem;box-shadow:2px 2px 0 var(--ink)}
.jbar{height:14px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.jfill{height:100%;width:42%;background:var(--accent);transition:width .2s}
input[type=range]{width:100%;margin:16px 0 4px;-webkit-appearance:none;appearance:none;background:transparent;cursor:grab;height:32px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--ink-15);border:1px solid var(--ink-30)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--ink-15);border:1px solid var(--ink-30)}
input[type=range]::-moz-range-thumb{width:27px;height:27px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.jsent{font-size:.92rem;font-weight:600;color:#4A4235;min-height:3.4em}
.sec{padding:64px 0}
.sec-head{text-align:center;max-width:620px;margin:0 auto 40px}
.sec-head h2{font-size:clamp(1.5rem,5vw,2.15rem);margin:10px 0 8px;line-height:1.5}
.steps{max-width:660px;margin-inline:auto}
.step{position:relative;padding-inline-start:72px;padding-bottom:38px}
.step::before{content:'';position:absolute;inset-inline-start:25px;top:56px;bottom:4px;border-inline-start:2px dashed var(--ink-30)}
.step:last-child{padding-bottom:0}.step:last-child::before{display:none}
.step-n{position:absolute;inset-inline-start:0;top:0;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font-weight:700;font-size:1.3rem;background:var(--hl)}
.step h3{font-size:1.12rem;margin-bottom:2px}.step p{color:var(--muted);font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:repeat(3,1fr)}}
.subj{display:flex;align-items:center;gap:13px;padding:16px;text-align:start;cursor:pointer;transition:transform .12s,box-shadow .12s}
.subj:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.subj .sic{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--ink);background:var(--hl);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.subj .sic svg{width:22px;height:22px}
.subj b{display:block;font-size:1rem}.subj span{font-size:.8rem;color:var(--muted);font-weight:500}
.subj-note{text-align:center;margin-top:18px}
.band{background:var(--ink);color:var(--paper);padding:64px 0;text-align:center}
.band h2{font-size:clamp(1.4rem,5vw,2.1rem);line-height:1.55;max-width:26ch;margin:0 auto 10px}
.band h2 span{color:var(--hl)}.band p{opacity:.85;margin-bottom:26px}
.foot{border-top:1.5px solid var(--ink);padding:24px 0}
.foot .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.wiz{padding:34px 0 70px}
.wiz-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.wcount{font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap}
.wiz-head{margin:4px 0 22px}
.wiz-head h1{font-size:clamp(1.45rem,5.5vw,2.05rem);line-height:1.5;margin-bottom:4px;font-weight:700}
.wiz-head p{color:var(--muted);font-size:.95rem;max-width:56ch}
.stepper{position:relative;display:flex;margin:6px 0 30px}
.sn-track{position:absolute;top:17px;right:4%;left:4%;border-top:2.5px dashed var(--ink-30)}
.sn-prog{position:absolute;top:17px;right:4%;width:0;border-top:2.5px solid var(--green);transition:width .45s}
.step-node{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;cursor:pointer;padding:0 2px}
.sn-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.78rem;background:var(--card);color:var(--muted);box-shadow:2px 2px 0 var(--ink);position:relative;z-index:1;transition:.2s}
.step-node svg{width:13px;height:13px}
.step-node.done .sn-dot{background:var(--green);color:#fff;border-color:var(--green)}
.step-node.now .sn-dot{background:var(--accent);color:#fff;transform:scale(1.12)}
.sn-lab{font-size:.58rem;font-weight:700;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.step-node.now .sn-lab{color:var(--ink)}.step-node.done .sn-lab{color:var(--green)}
.wiz-q h2{font-size:clamp(1.3rem,5vw,1.75rem);line-height:1.5;margin-top:4px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:16px;text-align:start;cursor:pointer;transition:transform .12s,box-shadow .12s}
.opt:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.opt .oic{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;flex:none}
.opt .oic svg{width:20px;height:20px;color:var(--accent)}
.opt b{display:block;font-size:1rem}.opt span{display:block;font-size:.82rem;color:var(--muted);font-weight:500}
.opt.g-opt{justify-content:center;font-weight:600;font-size:1.05rem}
.opt-check{position:absolute;top:-9px;inset-inline-start:-9px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center;border:1.5px solid var(--ink)}
.opt-check svg{width:13px;height:13px}
.opt.sel{border-color:var(--green);background:var(--green-soft);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.opt.sel .opt-check{display:grid}
.mck{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:7px;background:#fff;flex:none;display:grid;place-items:center;margin-inline-start:auto}
.mck svg{width:15px;height:15px;color:#fff;opacity:0}
.opt.sel .mck{background:var(--green);border-color:var(--green)}.opt.sel .mck svg{opacity:1}
.wiz-foot{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wiz-count{font-size:.85rem;font-weight:700;color:var(--muted)}
.txtin{width:100%;font-family:inherit;font-size:1.05rem;font-weight:600;padding:14px 16px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.txtin:focus{outline:2.5px solid var(--accent);outline-offset:1px}
.dash{padding:28px 0 80px}
.greet{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700}
.greet svg{color:var(--accent)}
.lvlcard{display:flex;align-items:center;gap:18px;padding:18px 20px;margin:14px 0 16px;flex-wrap:wrap}
.lvl-big{font-size:3rem;font-weight:700;line-height:1;min-width:74px;text-align:center}
.lvl-side{flex:1;min-width:200px}
.pblocks{display:flex;gap:5px;margin:8px 0 4px}
.pblock{width:20px;height:26px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;transition:.2s}
.pblock.on{background:var(--green);border-color:var(--green)}
.plab{font-size:.82rem;font-weight:700;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;cursor:pointer;text-align:start;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tile .tic{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ink);background:var(--hl);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.tile.pri{background:var(--accent);color:#fff}
.tile.pri .tic{background:#fff}.tile.pri .tic svg{color:var(--accent)}
.tile b{font-size:.98rem}.tile span{font-size:.78rem;color:var(--muted);font-weight:600}
.tile.pri span{color:#FFE4D6}
.coach{padding:16px 18px;margin-top:16px}
.coach-h{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:8px}
.coach-h .cav{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:var(--hl);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.cmsg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1.5px dashed var(--ink-15);font-size:.92rem}
.cmsg:last-child{border:none}
.cmsg svg{margin-top:5px;color:var(--accent);flex:none}
.today{padding:26px 0 80px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dcount{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:700;font-size:.85rem;background:var(--card);box-shadow:2px 2px 0 var(--ink)}
.dcount svg{color:var(--accent)}
.lessoncard{padding:20px;margin-bottom:16px}
.taskrow{display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1.5px dashed var(--ink-15);cursor:pointer;border-radius:8px}
.taskrow:last-of-type{border:none}
.taskrow:hover{background:var(--paper)}
.taskrow .tkic{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--ink);background:var(--hl);display:grid;place-items:center;flex:none;box-shadow:2px 2px 0 var(--ink)}
.taskrow .tkic svg{width:19px;height:19px}
.taskrow .tk-t{flex:1;min-width:0}
.taskrow .tk-t b{display:block;font-size:.96rem}
.taskrow .tk-t span{font-size:.78rem;color:var(--muted);font-weight:600}
.tks{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border:1.5px solid var(--ink);border-radius:99px;padding:2px 11px;background:var(--card);white-space:nowrap}
.tks.done{background:var(--green);color:#fff;border-color:var(--green)}
.dtip{margin-top:14px;background:var(--amber-soft);border:1.5px dashed var(--amber);border-radius:10px;padding:9px 13px;display:flex;gap:9px;font-size:.86rem;align-items:flex-start}
.dtip svg{color:var(--amber);margin-top:4px;flex:none}
.lect{padding:26px 0 80px}
.lsec{margin-bottom:22px}
.lsec>h3{display:flex;align-items:center;gap:9px;font-size:1.08rem;margin-bottom:10px}
.lsec>h3 .ln{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--ink);background:var(--hl);display:grid;place-items:center;font-size:.85rem;box-shadow:2px 2px 0 var(--ink);flex:none}
.lsec>p{font-size:.98rem;color:#33291B;margin-bottom:10px}
.sumlist{list-style:none}
.sumlist li{position:relative;padding-inline-start:20px;margin-bottom:6px;font-size:.94rem}
.sumlist li::before{content:'';position:absolute;inset-inline-start:0;top:.62em;width:9px;height:9px;background:var(--hl);border:1.5px solid var(--ink);border-radius:3px}
.gold{display:flex;gap:11px;background:#FFF3C4;border:1.5px solid var(--ink);border-radius:11px;padding:12px 15px;align-items:flex-start}
.gold svg{color:var(--accent);margin-top:4px;flex:none}
.gold b{color:var(--accent);display:block;font-size:.85rem}
.gold p{font-weight:600;margin:0;font-size:.95rem}
.diag{padding:30px 0 80px}
.diag-hero{padding:24px 22px;text-align:center;position:relative;margin-bottom:16px}
.stamp{position:absolute;top:16px;inset-inline-end:20px;border:2.5px solid var(--accent);color:var(--accent);border-radius:9px;padding:3px 13px;font-weight:700;font-size:.8rem;outline:1.5px solid var(--accent);outline-offset:3px;animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) .3s both}
.dsec{padding:16px 18px;margin-bottom:14px}
.dsec h3{display:flex;align-items:center;gap:9px;font-size:1.02rem;margin-bottom:10px;flex-wrap:wrap}
.dsec h3 svg{color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
.dot.r{background:var(--red)}.dot.y{background:var(--hl)}.dot.g{background:var(--green)}
.trow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1.5px dashed var(--ink-15);font-size:.94rem;flex-wrap:wrap}
.trow:last-child{border:none}
.twhy{margin-inline-start:auto;font-size:.78rem;color:var(--muted);font-weight:600}
.timechip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border:1.5px solid var(--ink);border-radius:99px;padding:2px 11px;background:var(--card);white-space:nowrap;direction:ltr}
.statrow{display:flex;flex-wrap:wrap;padding:16px 6px;margin-bottom:16px}
.stt{flex:1 1 120px;text-align:center;padding:6px 10px;border-inline-start:1.5px dashed var(--ink-15)}
.stt:first-child{border:none}
.stt b{font-size:1.6rem;display:block;line-height:1.4}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%) translateY(24px);opacity:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 20px;display:flex;gap:10px;align-items:center;z-index:99;font-weight:600;font-size:.92rem;transition:.35s;pointer-events:none;max-width:88vw}
.toast svg{color:var(--hl)}
.toast.show{opacity:1;transform:translateX(50%)}
#pdfH{position:fixed;top:-10000px;right:0;width:800px;background:#fff;padding:40px;direction:rtl;color:#241E14;font-family:'IBM Plex Sans Arabic',sans-serif}
#pdfH h1{font-size:22pt;margin-bottom:4pt;color:#C13A0D}
#pdfH .ps{font-size:10pt;color:#666;margin-bottom:20pt;border-bottom:2pt solid #C13A0D;padding-bottom:10pt}
#pdfH .pi{display:grid;grid-template-columns:1fr 1fr;gap:8pt;margin-bottom:16pt}
#pdfH .pi div{border:1pt solid #ddd;padding:8pt;border-radius:6pt;background:#F9F7F3}
#pdfH .pi b{display:block;font-size:8pt;color:#888}
#pdfH .pi span{font-size:11pt;font-weight:700}
#pdfH .pd{border:1pt solid #ddd;border-radius:6pt;margin-bottom:8pt;overflow:hidden}
#pdfH .pdh{background:#C13A0D;color:#fff;padding:6pt 10pt;font-weight:700;font-size:11pt}

function applyLang(){
  document.documentElement.lang=LANG==='en'?'en':'ar';document.documentElement.dir=LANG==='en'?'ltr':'rtl';document.body.classList.toggle('en',LANG==='en');
  var root=document.body;
  var map=LANG==='en'?EN:AR;
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(function(n){if(!n.nodeValue.trim())return;var x=n.nodeValue;Object.keys(map).sort(function(a,b){return b.length-a.length}).forEach(function(k){x=x.split(k).join(map[k])});if(LANG==='en')x=toEnNums(x);else x=x.replace(/[0-9]/g,function(d){return ARD[+d]});n.nodeValue=x});

}

    var cv=await html2canvas(document.getElementById('pdfH'),{scale:2,backgroundColor:'#ffffff'});
    var J=window.jspdf.jsPDF,pdf=new J('p','mm','a4');
    var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    var iw=pw-20,ih=cv.height*iw/cv.width;
    if(ih<=ph-20)pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',10,10,iw,ih);
    else{var pp=Math.ceil(ih/(ph-20)),ch=Math.ceil(cv.height/pp);
      for(var i=0;i<pp;i++){if(i>0)pdf.addPage();
        var tc=document.createElement('canvas');tc.width=cv.width;tc.height=Math.min(ch,cv.height-i*ch);
        tc.getContext('2d').drawImage(cv,0,i*ch,cv.width,tc.height,0,0,cv.width,tc.height);
        pdf.addImage(tc.toDataURL('image/jpeg',.95),'JPEG',10,10,iw,tc.height*iw/cv.width)}}
    pdf.save('Study-Rescue-Plan.pdf');toast('تم تنزيل خطتك PDF','dl');
  }catch(e){toast('خطأ في PDF','x')}
}
function start(){if(!SB_USER){showAuth('login');return}obStep=0;rOb();go('v-ob')}
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t)return;
  var a=t.getAttribute('data-act'),v=t.getAttribute('data-val');
  try{ACT(a,v,t)}catch(err){console.error(err);toast('خطأ','x')}
});
function ACT(a,v,t){
  if(a==='lang'){toggleLang();return}
  if(a==='auth'){showAuth(v||'login');return}
  if(a==='authmode'){showAuth(v||'login');return}
  if(a==='authSubmit'){authSubmit();return}
  if(a==='forgot'){forgotPassword();return}
  if(a==='logout'){logout();return}
  if(a==='brand'){if(db)renderDash();else if(SB_USER)start();else showAuth('login');return}
  if(a==='how'){go('v-home');setTimeout(function(){var h=document.getElementById('how');if(h)h.scrollIntoView({behavior:'smooth'})},80);return}
  if(a==='start'){if(db)renderDash();else if(SB_USER)start();else showAuth('register');return}
  if(a==='obback'){if(obStep>0){obStep--;rOb()}else{home();go('v-home')}return}
  if(a==='obgo'){obStep=+v;rOb();return}
  if(a==='obnext'){
    if(OBS[obStep][0]==='exam_date'&&OB.etype==='date'&&!OB.exam_date){toast('اختر تاريخ اختبارك','x');return}
    if(obStep>=OBS.length-1){finishOb();return}
    obStep++;rOb();return}
  if(a==='obp'){var i=OB.problems.indexOf(v);
    if(i>=0){OB.problems.splice(i,1);t.classList.remove('sel')}else{OB.problems.push(v);t.classList.add('sel')}return}
  if(a==='obfin'){
    var nm=document.getElementById('obN');
    OB.name=nm ? nm.value.trim() : (OB.name||'');
    finishOb();
    return;
  }
  if(a==='newplan'){startNewPlan(v);return}
  if(a==='switchplan'){switchPlan(v);return}

  if(a==='obopt'){
    var k=OBS[obStep][0];
    if(k==='exam_date'&&v==='date'){OB.etype='date';rOb();return}
    if(obAdv)return;obAdv=true;
    var bs=document.querySelectorAll('#obBody .opt');
    for(var q=0;q<bs.length;q++)bs[q].classList.remove('sel');
    t.classList.add('sel');
    if(k==='grade'||k==='time_avail')OB[k]=+v;
    else if(k==='exam_date'){OB.etype=v;if(v!=='none'&&v!=='date'){var dd=null;EXAMS.forEach(function(x){if(x[0]===v)dd=x[1]});OB.exam_date=dd?addDays(todayKey(),dd):null}}
    else OB[k]=v;
    if(k==='name'){obAdv=false;return}
    setTimeout(function(){obAdv=false;obStep++;rOb()},280);
    return}
  if(a==='page'){
    if(v==='start'){if(SB_USER)rStart();else showAuth('login')}else if(v==='planner')rPlanner();else if(v==='routine')rRoutine()
    else if(v==='methods')rMethods();else if(v==='tips')rTips();else if(v==='prog')rProg()
    else if(v==='goal')rGoal();else if(v==='dash'){if(SB_USER)renderDash();else showAuth('login')}else if(v==='home'){if(SB_USER){home();go('v-home')}else showAuth('login')}
    return}
  if(a==='today'){rToday();return}
  if(a==='stask'){
    var T=tState();var task=T.tasks[+v];if(!task)return;
    openTask(task,function(){T.done['t'+v]=1;db.minutes+=task.m;db.tasks++;db.studyHabits=db.studyHabits||{};db.studyHabits.completedDays=db.days_done.length;db.studyHabits.consistency=streak();syncStudentProfile();save();rToday()});
    return}
  if(a==='quick'){rQuick(+v);return}
  if(a==='rq'){
    var ts=window._q||[];var tk2=ts[+v];
    if(!tk2){toast('انتهت الجلسة','trophy');renderDash();return}
    openTask(tk2,function(){db.minutes+=tk2.m;db.tasks++;db.studyHabits=db.studyHabits||{};db.studyHabits.completedDays=db.days_done.length;db.studyHabits.consistency=streak();syncStudentProfile();save();
      var nx=ts[+v+1];
      if(nx){window._q=ts;rQuick(0);openTask(nx,arguments.callee)}
      else{toast('أنجزت جلستك','trophy');renderDash()}});
    return}
  if(a==='tog'){tog();return}
  if(a==='tdone'){if(!RUN)return;sp();RUN.cb();return}
  if(a==='tout'){sp();RUN=null;go('v-dash');return}
  if(a==='daydone'){
    db.days_done.push(todayKey());db.day_idx++;db.today=null;TIPX=null;db.studyHabits=db.studyHabits||{};db.studyHabits.completedDays=db.days_done.length;db.studyHabits.consistency=streak();syncStudentProfile();
    save();toast('أنهيت يومك','trophy');renderDash();return}
  if(a==='savert'){
    db.routine.wake=document.getElementById('rW').value;db.routine.schoolEnd=document.getElementById('rE').value;db.routine.sleep=document.getElementById('rS').value;syncStudentProfile();
    save();toast('حفظنا روتينك','check');rRoutine();return}
  if(a==='method'){rMethod(v);return}
  if(a==='applym'){
    db.methods_done[v]=1;syncStudentProfile();
    var T2=tState();T2.tasks.forEach(function(x,i){if(x.k==='method'&&x.mid===v)T2.done['t'+i]=1});
    save();toast('مهارة جديدة','brain');rMethod(v);return}
  if(a==='pdf'){pdf();return}
  if(a==='setgoal'){db.goal_grade=+v;syncStudentProfile();save();toast('هدفك الآن '+toAr(v),'target');rGoal();return}
  if(a==='reset'){
    if(t.getAttribute('data-arm')){db=null;try{localStorage.removeItem(KEY)}catch(e){};start()}
    else{t.setAttribute('data-arm','1');t.innerHTML='متأكد؟ اضغط مرة أخرى';setTimeout(function(){if(document.body.contains(t)){t.removeAttribute('data-arm');t.innerHTML=ic('rot')+' خطة جديدة'}},3500)}
    return}
}
function addDays(iso,n){var d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
(async function(){
  applyLang();
  if(!backendConfigured()){showAuth('login');console.warn('Study Rescue: configure Supabase before public launch.');return}
  try{
    var sessionRes=await sb.auth.getSession();
    SB_USER=sessionRes.data&&sessionRes.data.session?sessionRes.data.session.user:null;
    if(SB_USER){await remoteLoadUser();if(db){syncStudentProfile();renderDash()}else{showAuth('login')}}else{showAuth('login')}
    sb.auth.onAuthStateChange(async function(event,session){
      SB_USER=session?session.user:null;
      if(event==='SIGNED_IN'&&SB_USER){await remoteLoadUser();if(db){syncStudentProfile();renderDash()}}
      if(event==='SIGNED_OUT'){db=null;STUDY_PLANS={};ACTIVE_SUBJECT=null;showAuth('login')}
    });
  }catch(e){console.error(e)}
})();
</script>
